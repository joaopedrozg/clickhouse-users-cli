name: Publish to PyPI

# Publica automaticamente após o merge do PR na main:
# incrementa o patch (x.y.Z+1), commita a versão, builda e sobe para o PyPI.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita duas publicações concorrentes (cada push gera uma versão nova).
concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # Ignora o próprio commit de bump de versão (também marcado com [skip ci]).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version-file: ".python-version"
          enable-cache: true

      - name: Bump patch version
        id: bump
        run: |
          uv run python - <<'EOF'
          import os
          import pathlib
          import re

          p = pathlib.Path("clickhouse_users_cli/__init__.py")
          text = p.read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text)
          if not m:
              raise SystemExit("ERRO: __version__ = \"x.y.z\" nao encontrada em clickhouse_users_cli/__init__.py")
          major, minor, patch = map(int, m.groups())
          new = f"{major}.{minor}.{patch + 1}"
          p.write_text(
              re.sub(r'(__version__\s*=\s*")[^"]+(")', rf"\g<1>{new}\g<2>", text),
              encoding="utf-8",
          )
          print(f"Nova versao: {new}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={new}\n")
          EOF

      - name: Refresh lockfile and commit bump
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clickhouse_users_cli/__init__.py uv.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"

      - name: Build and check
        run: |
          uv build
          uvx twine check dist/*

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.KEI_API_PYPI }}
        run: uv publish

      - name: Push version bump
        run: git push
